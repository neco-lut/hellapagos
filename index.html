<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>座席くじ引き</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;color:#1f2937;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px 14px 48px}
h1{text-align:center;margin:8px 0 4px;font-size:28px}.lead{text-align:center;color:#6b7280;margin:0 0 20px}
.card{background:#fff;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 24px rgba(0,0,0,.07)}
h2{font-size:20px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;align-items:center;gap:8px}.num{width:28px;color:#6b7280;text-align:center}
input{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
input:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
button{font:inherit;border:0;border-radius:13px;cursor:pointer}
.primary{width:100%;padding:15px;background:#111827;color:#fff;font-weight:800;font-size:17px;margin-top:16px}
.secondary{padding:12px 16px;background:#e5e7eb;font-weight:700}
.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:12px;margin-top:12px;display:none}
.hidden{display:none!important}
.turn{text-align:center;font-weight:800;font-size:18px;margin-bottom:14px}
.name-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}
.name-btn{padding:13px;background:#eef0f3;font-weight:700}
.name-btn.selected{background:#111827;color:white}.name-btn:disabled{opacity:.35;cursor:not-allowed}
.lottery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.lottery-btn{aspect-ratio:1;border-radius:16px;background:#e5e7eb;font-size:22px;font-weight:900}
.lottery-btn:disabled{opacity:.35;cursor:not-allowed}
.message{text-align:center;background:#f3f4f6;border-radius:14px;padding:14px;margin-top:14px;font-weight:800}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seat{min-height:82px;border:2px solid #e5e7eb;border-radius:15px;padding:10px;text-align:center}
.seatno{font-size:12px;color:#6b7280}.person{font-weight:800;margin-top:7px;word-break:break-word}
.results{list-style:none;padding:0;margin:0}.results li{display:flex;justify-content:space-between;padding:11px 3px;border-bottom:1px solid #eee}
.note{font-size:13px;color:#6b7280;margin-top:8px}
.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding-top:12px}.card{padding:17px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🚄 座席くじ引き</h1>
<p class="lead">名前と座席番号を設定して、みんなでくじを引こう！</p>

<section id="setup" class="card">
<h2>参加者（8人）</h2>
<div id="peopleInputs" class="grid"></div>
<h2 style="margin-top:22px">座席番号（8席）</h2>
<div id="seatInputs" class="grid"></div>
<p class="note">※ 座席番号は自由に変更できます。名前・座席番号は重複できません。</p>
<div id="error" class="error"></div>
<button id="start" class="primary">くじ引きを開始する</button>
</section>

<section id="lottery" class="card hidden">
<div id="turn" class="turn"></div>
<div id="nameGrid" class="name-grid"></div>
<div class="lottery-grid" id="lotteryGrid"></div>
<div id="drawMessage" class="message hidden"></div>
<p class="note">① 自分の名前を選択 → ② 1〜8の好きな番号を押す</p>
</section>

<section id="final" class="card hidden">
<h2>🎉 座席決定結果</h2>
<h3>座席表</h3>
<div id="seatMap" class="seats"></div>
<h3>結果一覧</h3>
<ul id="results" class="results"></ul>
<div class="actions"><button id="again" class="secondary">もう一度引く</button></div>
</section>
</div>

<script>
const DEFAULT_PEOPLE=["うめつ","かの","くろぎ","きんにく","れお","いとせ","はまいし","まなか"];
const DEFAULT_SEATS=["1A","1B","2A","2B","2C","3A","3B","3C"];
let people=[],seats=[],remainingLottery=[],remainingSeats=[],selectedPerson=null,assignments={},lotteryOwners={};

const $=id=>document.getElementById(id);
function makeInputs(containerId,values,prefix){
  $(containerId).innerHTML=values.map((v,i)=>`<label class="field"><span class="num">${i+1}</span><input id="${prefix}${i}" value="${escapeHtml(v)}" autocomplete="off"></label>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function readSetup(){
  people=Array.from({length:8},(_,i)=>$(`p${i}`).value.trim());
  seats=Array.from({length:8},(_,i)=>$(`s${i}`).value.trim());
}
function validate(){
  readSetup();
  if(people.some(x=>!x)||seats.some(x=>!x))return "名前と座席番号を8個すべて入力してください。";
  if(new Set(people).size!==8)return "参加者名に重複があります。";
  if(new Set(seats).size!==8)return "座席番号に重複があります。";
  return "";
}
function startGame(){
  const err=validate();$("error").style.display=err?"block":"none";$("error").textContent=err;if(err)return;
  remainingLottery=shuffle([1,2,3,4,5,6,7,8]);
  remainingSeats=shuffle([...seats]);
  assignments={};lotteryOwners={};selectedPerson=null;
  $("setup").classList.add("hidden");$("final").classList.add("hidden");$("lottery").classList.remove("hidden");
  $("drawMessage").classList.add("hidden");renderNames();renderLottery();updateTurn();
}
function renderNames(){
  $("nameGrid").innerHTML=people.map(p=>`<button class="name-btn ${selectedPerson===p?"selected":""}" ${assignments[p]?"disabled":""} data-person="${escapeHtml(p)}">${escapeHtml(p)}${assignments[p]?" ✓":""}</button>`).join("");
  document.querySelectorAll(".name-btn").forEach(b=>b.onclick=()=>{if(!b.disabled){selectedPerson=b.dataset.person;renderNames();renderLottery();updateTurn()}});
}
function renderLottery(){
  $("lotteryGrid").innerHTML=remainingLottery.map(n=>`<button class="lottery-btn" ${selectedPerson?"":"disabled"} data-num="${n}">${n}</button>`).join("");
  document.querySelectorAll(".lottery-btn").forEach(b=>b.onclick=()=>draw(Number(b.dataset.num)));
}
function updateTurn(){
  const done=Object.keys(assignments).length;
  $("turn").textContent=selectedPerson?`${selectedPerson}さん、好きな番号を選んでください！`:`${done+1}人目：まず名前を選んでください`;
}
function draw(num){
  if(!selectedPerson)return;
  const seat=remainingSeats.pop(),person=selectedPerson;
  assignments[person]=seat;lotteryOwners[num]=person;
  remainingLottery=remainingLottery.filter(x=>x!==num);selectedPerson=null;
  $("drawMessage").textContent=`🎫 ${person}さん → ${seat}席`;
  $("drawMessage").classList.remove("hidden");
  renderNames();renderLottery();
  if(Object.keys(assignments).length===8){setTimeout(showFinal,650)}else updateTurn();
}
function showFinal(){
  $("lottery").classList.add("hidden");$("final").classList.remove("hidden");
  const bySeat={};Object.entries(assignments).forEach(([p,s])=>bySeat[s]=p);
  $("seatMap").innerHTML=seats.map(s=>`<div class="seat"><div class="seatno">${escapeHtml(s)}席</div><div class="person">${escapeHtml(bySeat[s]||"—")}</div></div>`).join("");
  $("results").innerHTML=people.map(p=>`<li><span>${escapeHtml(p)}</span><strong>${escapeHtml(assignments[p])}</strong></li>`).join("");
}
$("start").onclick=startGame;
$("again").onclick=()=>{$("final").classList.add("hidden");$("setup").classList.remove("hidden");};
makeInputs("peopleInputs",DEFAULT_PEOPLE,"p");makeInputs("seatInputs",DEFAULT_SEATS,"s");
</script>
</body>
</html>
