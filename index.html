<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サバイバル・イカダ脱出（回しプレイ版）</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #2c3e50; color: #ecf0f1; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: #34495e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h1 { margin-top: 0; color: #f1c40f; font-size: 20px; }

    /* 設定パネル */
    .setup-panel { background: #1a252f; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .count-control { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0; }
    .count-btn { background: #2980b9; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; }
    .start-btn { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }

    /* ステータス・ログ */
    .status-board { display: flex; justify-content: space-around; background: #1a252f; padding: 8px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
    .status-board span { display: block; font-size: 18px; font-weight: bold; color: #3498db; }
    .log-box { background: #1a252f; height: 120px; overflow-y: auto; text-align: left; padding: 8px; font-size: 12px; border-radius: 6px; margin-bottom: 10px; color: #bdc3c7; line-height: 1.4; }

    /* ターン交代用オーバーレイ（手札隠し） */
    .pass-screen { background: #1a252f; border: 2px solid #f39c12; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
    .pass-screen h2 { color: #f39c12; margin-top: 0; }

    /* アクション・手札エリア */
    .my-hand { background: #2980b9; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: left; font-size: 13px; }
    .my-hand-title { font-weight: bold; color: #f1c40f; margin-bottom: 5px; }
    .action-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .act-btn { background: #e67e22; border: none; color: white; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }

    /* プレイヤーリスト */
    .player-list { display: flex; flex-direction: column; gap: 6px; text-align: left; max-height: 180px; overflow-y: auto; }
    .player-card { background: #2c3e50; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .player-card.active { border: 2px solid #f1c40f; background: #34495e; }
    .player-card.dead { opacity: 0.4; text-decoration: line-through; }
    .badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🏝️ サバイバル・イカダ脱出</h1>

  <!-- 設定パネル -->
  <div id="setupPanel" class="setup-panel">
    <h3>プレイヤー人数の選択</h3>
    <div class="count-control">
      <button class="count-btn" onclick="changeCount(-1)">ー</button>
      <span id="playerCountDisplay" style="font-size:22px; font-weight:bold; color:#f1c40f;">4人</span>
      <button class="count-btn" onclick="changeCount(1)">＋</button>
    </div>
    <button class="start-btn" onclick="startGame()">ゲーム開始！</button>
  </div>

  <!-- メインゲームエリア -->
  <div id="gamePanel" style="display: none;">
    
    <div class="status-board">
      <div>💧 水<span id="water">0</span></div>
      <div>🐟 食料<span id="food">0</span></div>
      <div>🪵 イカダ<span id="raft">0</span></div>
      <div>📅 残り日数<span id="days">6</span></div>
    </div>

    <div id="log" class="log-box"></div>

    <!-- 交代案内画面（手札保護） -->
    <div id="passScreen" class="pass-screen">
      <h2 id="turnAnnounce">プレイヤー1 のターン</h2>
      <p style="font-size:13px; color:#ecf0f1;">スマホを渡してください。<br>準備ができたら下のボタンを押して手札を確認してください。</p>
      <button class="start-btn" onclick="startTurn()">手札を確認してプレイ開始</button>
    </div>

    <!-- プレイ操作画面 -->
    <div id="actionScreen" style="display: none;">
      <!-- 自分の手札表示 -->
      <div class="my-hand">
        <div class="my-hand-title">🎒 あなた（<span id="currPlayerName"></span>）の所持アイテム:</div>
        <div id="myItemsList">なし</div>
      </div>

      <!-- アクション選択 -->
      <div class="action-group">
        <button class="act-btn" onclick="takeAction('water')">💧 水を汲む</button>
        <button class="act-btn" onclick="takeAction('food')">🐟 魚を釣る</button>
        <button class="act-btn" onclick="takeAction('raft')">🪵 イカダを作る</button>
        <button class="act-btn" onclick="takeAction('item')">📦 アイテム捜索</button>
      </div>
    </div>

    <h3>参加者の状態（アイテム枚数）</h3>
    <div id="playerList" class="player-list"></div>

  </div>
</div>

<script>
  let playerCount = 4;
  let gameActive = false;

  const state = {
    water: 0,
    food: 0,
    raft: 0,
    daysLeft: 6,
    currentTurnIndex: 0,
    players: []
  };

  const itemsPool = ["水筒 (水+3)", "缶詰 (食料+3)", "木箱 (イカダ+1)", "釣り竿", "ナイフ"];

  function changeCount(delta) {
    playerCount = Math.min(10, Math.max(2, playerCount + delta));
    document.getElementById('playerCountDisplay').innerText = `${playerCount}人`;
  }

  function startGame() {
    gameActive = true;
    state.water = playerCount * 2;
    state.food = playerCount * 2;
    state.raft = 0;
    state.daysLeft = 6;
    state.currentTurnIndex = 0;

    state.players = [];
    for (let i = 1; i <= playerCount; i++) {
      state.players.push({
        id: i - 1,
        name: `プレイヤー ${i}`,
        alive: true,
        items: []
      });
    }

    document.getElementById('setupPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';

    log(`<b>--- サバイバル開始（全${playerCount}人）---</b>`);
    prepareTurn();
  }

  function log(msg) {
    const box = document.getElementById('log');
    box.innerHTML += msg + "<br>";
    box.scrollTop = box.scrollHeight;
  }

  // ターン準備（スマホを渡す画面を表示）
  function prepareTurn() {
    const p = state.players[state.currentTurnIndex];
    document.getElementById('passScreen').style.display = 'block';
    document.getElementById('actionScreen').style.display = 'none';
    document.getElementById('turnAnnounce').innerText = `📱 ${p.name} のターン`;
    updateUI();
  }

  // 「プレイ開始」を押したら自分の手札とアクションを表示
  function startTurn() {
    const p = state.players[state.currentTurnIndex];
    document.getElementById('passScreen').style.display = 'none';
    document.getElementById('actionScreen').style.display = 'block';
    
    document.getElementById('currPlayerName').innerText = p.name;
    const itemList = document.getElementById('myItemsList');
    itemList.innerText = p.items.length > 0 ? p.items.join(', ') : 'なし';
  }

  function takeAction(type) {
    const p = state.players[state.currentTurnIndex];

    if (type === 'water') {
      const rain = Math.floor(Math.random() * 3) + 1;
      state.water += rain;
      log(`${p.name}: 水を汲んだ（+${rain} 💧）`);
    } else if (type === 'food') {
      const caught = Math.floor(Math.random() * 3) + 1;
      state.food += caught;
      log(`${p.name}: 魚を釣った（+${caught} 🐟）`);
    } else if (type === 'raft') {
      state.raft += 1;
      log(`${p.name}: イカダを作った（+1 🪵）`);
    } else if (type === 'item') {
      const item = itemsPool[Math.floor(Math.random() * itemsPool.length)];
      p.items.push(item);
      log(`${p.name}: 漂流物からアイテムを獲得！`);
    }

    // 次の生存者へターンを移行
    nextTurn();
  }

  function nextTurn() {
    let nextIndex = (state.currentTurnIndex + 1) % state.players.length;

    // 1ラウンド（全員の行動）終了時の判定
    if (nextIndex === 0) {
      checkRoundEnd();
    } else {
      // 生きてるプレイヤーまでスキップ
      while (!state.players[nextIndex].alive) {
        nextIndex = (nextIndex + 1) % state.players.length;
        if (nextIndex === 0) {
          checkRoundEnd();
          break;
        }
      }
      state.currentTurnIndex = nextIndex;
      prepareTurn();
    }
  }

  // 1日の終わり（全員行動後）の資材消費
  function checkRoundEnd() {
    const alivePlayers = state.players.filter(p => p.alive);
    const needed = alivePlayers.length;

    log(`<b>--- 一日が終了（必要数: 💧${needed} / 🐟${needed}）---</b>`);
    state.water -= needed;
    state.food -= needed;

    if (state.water < 0 || state.food < 0) {
      log(`<span style="color:#e74c3c;">⚠️ 資材不足！最後に動いた ${state.players[state.currentTurnIndex].name} が責任をとって追放されました...</span>`);
      state.players[state.currentTurnIndex].alive = false;
      if (state.water < 0) state.water = 0;
      if (state.food < 0) state.food = 0;
    }

    state.daysLeft -= 1;

    if (state.daysLeft <= 0) {
      endGame();
    } else {
      // 次の日へ（生存している最初のプレイヤーから開始）
      state.currentTurnIndex = state.players.findIndex(p => p.alive);
      prepareTurn();
    }
  }

  function endGame() {
    const alive = state.players.filter(p => p.alive);
    log(`<b>🌪️ ハリケーンが到着！ゲーム終了！</b>`);
    if (state.raft >= alive.length) {
      log(`<span style="color:#2ecc71;">🎉 生存者${alive.length}人全員がイカダ（${state.raft}艘）で脱出成功！</span>`);
    } else {
      log(`<span style="color:#e74c3c;">💀 イカダが足りず、全員失敗...</span>`);
    }
    document.getElementById('passScreen').style.display = 'none';
    document.getElementById('actionScreen').style.display = 'none';
  }

  function updateUI() {
    document.getElementById('water').innerText = Math.floor(state.water);
    document.getElementById('food').innerText = Math.floor(state.food);
    document.getElementById('raft').innerText = state.raft;
    document.getElementById('days').innerText = state.daysLeft;

    const list = document.getElementById('playerList');
    list.innerHTML = '';

    state.players.forEach((p, idx) => {
      const card = document.createElement('div');
      const isCurrent = idx === state.currentTurnIndex;
      card.className = `player-card ${isCurrent ? 'active' : ''} ${p.alive ? '' : 'dead'}`;
      
      card.innerHTML = `
        <span>${isCurrent ? '👉 ' : ''}${p.name}</span>
        <div>
          <span class="badge">🎒 ${p.items.length}枚</span>
          <span>${p.alive ? '生存' : '脱落'}</span>
        </div>
      `;
      list.appendChild(card);
    });
  }
</script>
</body>
</html>
